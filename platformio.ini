[env:esp32dev]
platform = espressif32@6.4.0
board = esp32dev
framework = arduino

; Flash optimization: huge_app gives 3MB app partition (vs default 1.25MB)
; OTA is not used on ChronoSync so this is safe
board_build.partitions = huge_app.csv

monitor_speed = 115200
upload_speed = 115200

lib_deps = 
    bodmer/TFT_eSPI@^2.5.43
    bodmer/TJpg_Decoder@^1.0.8
    bblanchon/ArduinoJson@^6.21.3

build_flags = 
    -Os
    -D CORE_DEBUG_LEVEL=0
    -D USER_SETUP_LOADED=1
    
    ; ESP32-3248S035 (3.5" IPS CYD) ST7796 Pinout
    -D ST7796_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_INVERSION_OFF
	-D TFT_RGB_ORDER=TFT_BGR    ; SPI Pins for 3.5" CYD
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=27
    -D TFT_BACKLIGHT_ON=HIGH
    
    ; SPI Settings (reduced for stability testing)
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    
    ; Touch Screen Pins (XPT2046)
    -D TOUCH_CS=33
    
    ; Enable fonts
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1